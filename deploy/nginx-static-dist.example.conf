# Static `dist/` only (no Streamlit). Microphone often behaves better than iframe.
# Build: npm ci && npm run build
# Sync: rsync -av dist/ /var/www/tutor/dist/

server {
    listen              443 ssl http2;
    server_name         voice-static.example.com;

    ssl_certificate     /etc/letsencrypt/live/voice-static.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voice-static.example.com/privkey.pem;

    root /var/www/tutor/dist;
    index index.html;

    gzip on;
    gzip_types application/javascript application/json text/css text/plain image/svg+xml;
    gzip_min_length 512;

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

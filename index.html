<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>V2V · Gemini Live</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hdr">
        <p class="eyebrow">V2V Live</p>
        <h1>Talk to Gemini</h1>
        <p class="sub">
          A minimal real-time voice interface powered by
          <code>gemini-3.1-flash-live-preview</code>.
        </p>
      </header>

      <section class="panel controls">
        <label class="chk">
          <input id="wantAudio" type="checkbox" checked />
          Play Gemini’s replies through your speakers
        </label>
        <div class="row voice-hint muted">
          Connect, allow microphone access, then speak naturally.
        </div>
        <div class="row actions">
          <button id="btnConnect" type="button" class="primary">Connect</button>
          <button id="btnDisconnect" type="button" disabled>Disconnect</button>
          <span id="status" class="status disconnected">Disconnected</span>
          <span id="listenHint" class="listen-hint"></span>
        </div>
      </section>

      <section class="panel chat">
        <label class="field log-label">
          <span>Conversation log</span>
          <pre id="log" class="log" aria-live="polite"></pre>
        </label>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

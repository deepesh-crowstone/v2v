# Matches what Railway builds: multi-stage Dockerfile (Node → dist → Streamlit).

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker build (same pipeline as Railway)
        run: docker build -t tutor-gemini-live:ci .
